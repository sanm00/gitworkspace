name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: gws version
      placeholder: Output of gws --version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, architecture, Go version, and Git version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe sequence of commands that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: shell
  - type: checkboxes
    id: security
    attributes:
      label: Security
      options:
        - label: This report does not disclose a security vulnerability.
          required: true
